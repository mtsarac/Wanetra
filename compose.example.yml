services:
  wanetra:
    image: ghcr.io/mtsarac/wanetra:latest
    container_name: wanetra
    restart: unless-stopped
    ports:
      - "${WANETRA_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      WANETRA_DATA_PATH: ${WANETRA_DATA_PATH:-/data}
    volumes:
      - ./data:/data
