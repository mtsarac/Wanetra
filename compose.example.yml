services:
  wanetra:
    build: .
    container_name: wanetra
    restart: unless-stopped
    ports:
      - "${WANETRA_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      WANETRA_DATA_PATH: ${WANETRA_DATA_PATH:-/data}
      DataRetention__Days: ${DataRetention__Days:-365}
    volumes:
      - wanetra-data:/data

volumes:
  wanetra-data:
