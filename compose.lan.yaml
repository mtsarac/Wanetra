# Wanetra on the host's network, so it can see your LAN. Linux hosts only.
#
#   docker compose -f compose.lan.yaml up -d
#
# With host networking the container has no port mapping: Wanetra listens on
# WANETRA_BIND_ADDRESS:WANETRA_PORT of the host itself. Keep it on 127.0.0.1 unless you
# need the UI from another machine, and read "Security" in the README before you change that.
services:
  wanetra:
    image: ghcr.io/mtsarac/wanetra:${WANETRA_VERSION:-latest}
    container_name: wanetra
    restart: unless-stopped
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://${WANETRA_BIND_ADDRESS:-127.0.0.1}:${WANETRA_PORT:-8080}
      TZ: ${TZ:-Europe/Istanbul}
      WANETRA_DATA_PATH: ${WANETRA_DATA_PATH:-/data}
      WANETRA_AUTH: ${WANETRA_AUTH:-}
      Lan__Enabled: ${Lan__Enabled:-true}
      Lan__Cidr: ${Lan__Cidr:-}
      Lan__ScanIntervalMinutes: ${Lan__ScanIntervalMinutes:-}
      Lan__OfflineAfterScans: ${Lan__OfflineAfterScans:-}
      Lan__AlertOnNewDevice: ${Lan__AlertOnNewDevice:-}
      DataRetention__Days: ${DataRetention__Days:-}
      Probes__Enabled: ${Probes__Enabled:-}
      Probes__IntervalSeconds: ${Probes__IntervalSeconds:-}
      SpeedTest__Engine: ${SpeedTest__Engine:-}
      SpeedTest__Ookla__AcceptLicense: ${SpeedTest__Ookla__AcceptLicense:-}
      SpeedTest__Ookla__ExecutablePath: ${SpeedTest__Ookla__ExecutablePath:-}
    # The image's own health check always asks port 8080.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${WANETRA_PORT:-8080}/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - wanetra-data:/data

volumes:
  wanetra-data:
