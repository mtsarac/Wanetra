version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Project stays on .NET 10; Microsoft.Extensions.* 11.x targets .NET 11.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: bun
    directory: /frontend
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not yet support TypeScript 7.
      - dependency-name: typescript
        versions: ["7.0.x"]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Project stays on .NET 10; do not bump to .NET 11 images.
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
